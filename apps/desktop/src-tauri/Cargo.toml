[package]
name = "lumatrace-desktop"
version = "0.0.0"
description = "LumaTrace desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = []
