name: Bug report
description: Report a reproducible LumaTrace issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste tokens, full local paths, raw logs, device serial numbers, logcat, bugreports, or raw CSV files.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which version or commit did you test?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - iOS
        - Desktop packaging
        - Other
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep this minimal and avoid sensitive data.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior

