name: Feature request
description: Suggest an improvement for LumaTrace.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would a good solution look like?
  - type: textarea
    id: constraints
    attributes:
      label: Safety and platform constraints
      description: Note any privacy, permission, platform API, or metric accuracy constraints.

