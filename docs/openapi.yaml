openapi: 3.1.0
info:
  title: LumaTrace Local Server API
  version: mvp-a
  description: >
    REST API for the LumaTrace MVP-A local server. The WebSocket endpoint
    is ws://127.0.0.1:3100/api/sessions/{id}/stream and emits session_status,
    metric, session_stopped, and error messages.
servers:
  - url: http://127.0.0.1:3100
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Server health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/devices:
    get:
      summary: Discover devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Device"
  /api/devices/{id}/targets:
    get:
      summary: List targets for a device
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/capabilities:
    get:
      summary: List metric capabilities
      description: Android capabilities include adb discovery/package/PID availability, CPU/memory/battery sampling, network sampling, and experimental FPS/frame-time probe paths. Windows PC capabilities include Local PC discovery, process targets, PID-bound CPU/memory sampling, and PresentMon-dependent FPS/frame-time collection.
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Platform"
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/MetricAvailability"
  /api/sessions:
    get:
      summary: List recent sessions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Recent sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Session"
    post:
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Created session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
    delete:
      summary: Delete all stored test results
      description: Deletes completed, failed, created, and stopped local sessions with their stored metrics, markers, reports, and diagnostics. Running or paused sessions are preserved.
      responses:
        "200":
          description: Deletion summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [deletedCount, skippedSessionIds]
                        properties:
                          deletedCount:
                            type: integer
                          skippedSessionIds:
                            type: array
                            items:
                              type: string
  /api/sessions/{id}:
    get:
      summary: Get a session
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
    delete:
      summary: Delete one stored test result
      description: Deletes the local session and its stored metrics, markers, report, and diagnostics. Running or paused sessions cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Deleted session result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sessionId, deleted]
                        properties:
                          sessionId:
                            type: string
                          deleted:
                            type: boolean
                            enum: [true]
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/start:
    post:
      summary: Start a session
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/pause:
    post:
      summary: Pause a session
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/stop:
    post:
      summary: Stop a session
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SessionResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/metrics:
    get:
      summary: Query raw metrics
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: fromTimestampMs
          in: query
          schema:
            type: integer
        - name: toTimestampMs
          in: query
          schema:
            type: integer
        - name: metricNames
          in: query
          schema:
            type: string
            example: fps,cpu_percent
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
            maximum: 10000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/MetricEvent"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/metrics/downsampled:
    get:
      summary: Query downsampled metric buckets
      description: Groups stored raw metrics into fixed-size buckets for long-session charting. Only numeric values are included; null or missing metrics are skipped and never converted to zero.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: bucketSizeMs
          in: query
          schema:
            type: integer
            default: 1000
            minimum: 1
            maximum: 3600000
        - name: fromTimestampMs
          in: query
          schema:
            type: integer
        - name: toTimestampMs
          in: query
          schema:
            type: integer
        - name: metricNames
          in: query
          schema:
            type: string
            example: fps,cpu_percent
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
            maximum: 10000
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Downsampled metric buckets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DownsampledMetricBucket"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/markers:
    get:
      summary: List session markers
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Markers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/EventMarker"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
    post:
      summary: Add marker
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarkerRequest"
      responses:
        "200":
          description: Marker
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/EventMarker"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/report:
    get:
      summary: Get report summary
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Report summary response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - summary
                          - cached
                          - rawMetricCount
                        properties:
                          summary:
                            $ref: "#/components/schemas/ReportSummary"
                          cached:
                            type: boolean
                          rawMetricCount:
                            type: integer
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/export:
    get:
      summary: Export report content
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, csv, html]
      responses:
        "200":
          description: Export content
          content:
            application/json:
              schema:
                type: object
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/android/{deviceId}/apps/{packageName}/start:
    post:
      summary: Explicitly start an Android app
      description: Uses adb shell am start -W when a launcher activity is known. Monkey fallback is optional and disabled by default. This does not start a metric session by itself.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
        - name: packageName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AndroidAppStartRequest"
      responses:
        "200":
          description: Android app start result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AndroidAppStartResult"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "503":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/android/{deviceId}/apps/{packageName}/stop:
    post:
      summary: Explicitly force-stop an Android app
      description: Uses adb shell am force-stop only as an explicit user action. It does not delete sessions or metrics.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
        - name: packageName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AndroidAppStopRequest"
      responses:
        "200":
          description: Android app stop result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AndroidAppStopResult"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
        "503":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/android/{deviceId}/health:
    get:
      summary: Android device health
      description: Returns adb/device state, sanitized cache summary, and Android Beta limitations. Does not include logcat or bugreport.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Android health
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/android/{deviceId}/cache/status:
    get:
      summary: Android metadata cache status
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cache status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
  /api/android/{deviceId}/cache/refresh:
    post:
      summary: Refresh Android metadata cache
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cache refresh result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
  /api/pc/{deviceId}/presentmon/status:
    get:
      summary: PresentMon tool and compatibility status
      description: Returns sanitized PresentMon tool status and compatibility for a Local PC device. PresentMon missing does not block PC CPU/memory.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PresentMon status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PcPresentMonStatus"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/presentmon/status:
    get:
      summary: PresentMon capture status for a session
      description: Returns the current or last sanitized capture status. No raw CSV or full local paths are returned.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: PresentMon capture status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PresentMonCaptureStatus"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/tools/status:
    get:
      summary: List tool status
      description: Includes adb status for Android collection and PresentMon status for Windows collection. PresentMon missing does not block Windows CPU or memory sampling.
      responses:
        "200":
          description: Tool status records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ToolStatus"
  /api/diagnostics:
    get:
      summary: List diagnostics
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
        - name: deviceId
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: fromTimestampMs
          in: query
          schema:
            type: integer
        - name: toTimestampMs
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Diagnostics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiagnosticRecord"
  /api/sessions/{id}/diagnostics:
    get:
      summary: List sanitized diagnostics for a session
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Session diagnostics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiagnosticRecord"
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/sessions/{id}/diagnostics/export:
    get:
      summary: Export sanitized session diagnostics
      description: Returns sanitized JSON or static HTML. Does not include logcat, bugreport, full serials, or raw long stdout/stderr.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: format
          in: query
          schema:
            type: string
            enum: [json, html]
            default: json
      responses:
        "200":
          description: Diagnostics export
          content:
            application/json:
              schema:
                type: object
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/packaged/status:
    get:
      summary: Get packaged sidecar status
      description: Requires auth in packaged mode. Returned paths are sanitized and the auth token is never returned.
      responses:
        "200":
          description: Packaged status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PackagedStatus"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/packaged/diagnostics/export:
    get:
      summary: Export sanitized packaging diagnostics
      description: Requires auth in packaged mode. Returns JSON only. Raw logs, auth tokens, full local paths, raw CSV, logcat, and bugreport data are omitted or redacted.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json]
            default: json
      responses:
        "200":
          description: Sanitized packaging diagnostics export
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PackagingDiagnosticsExport"
        "400":
          $ref: "#/components/responses/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
  /api/packaged/shutdown:
    post:
      summary: Gracefully shutdown packaged sidecar
      description: Requires auth in packaged mode. Used by Tauri during application exit.
      responses:
        "200":
          description: Shutdown requested
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          shuttingDown:
                            type: boolean
        "401":
          $ref: "#/components/responses/ApiErrorResponse"
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    ApiErrorResponse:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SessionResponse:
      description: Session response
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
  schemas:
    ApiSuccess:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data: {}
    ApiError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccess"
        - type: object
          properties:
            data:
              type: object
              required: [status, version, uptimeMs]
              properties:
                status:
                  type: string
                  const: ok
                version:
                  type: string
                uptimeMs:
                  type: integer
    Platform:
      type: string
      enum: [android, windows, macos, linux]
    ConnectionType:
      type: string
      enum: [usb, network, local]
    MetricPrecision:
      type: string
      enum: [exact, estimated, device_level, unavailable]
    MetricAvailabilityStatus:
      type: string
      enum:
        - available
        - unavailable
        - requires_tool
        - requires_permission
        - experimental
    Device:
      type: object
      required: [id, platform, name, connectionType, capabilities]
      properties:
        id:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        name:
          type: string
        osVersion:
          type: string
        connectionType:
          $ref: "#/components/schemas/ConnectionType"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/MetricAvailability"
        tags:
          type: object
    Target:
      type: object
      required: [id, name, type, platform]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [app, process, game]
        packageName:
          type: string
        bundleId:
          type: string
        pid:
          type: integer
        executablePath:
          type: string
        platform:
          $ref: "#/components/schemas/Platform"
        tags:
          type: object
    Session:
      type: object
      required: [id, name, deviceId, targetId, sampleIntervalMs, status]
      properties:
        id:
          type: string
        name:
          type: string
        deviceId:
          type: string
        targetId:
          type: string
        startedAt:
          type: integer
        endedAt:
          type: integer
        sampleIntervalMs:
          type: integer
        status:
          type: string
          enum: [created, running, paused, stopped, failed]
        notes:
          type: array
          items:
            type: string
        config:
          type: object
          description: Optional collector config. Android supports explicit lifecycle options and enableExperimentalFps. Windows PC supports explicit PresentMon capture options. Safe lifecycle/capture defaults are false.
          properties:
            profileName:
              type: string
            enableExperimentalFps:
              type: boolean
              default: false
              description: Android-only experimental FPS probe toggle. If layer matching fails or is ambiguous, no FPS metric is emitted.
            autoStartTarget:
              type: boolean
              default: false
            allowMonkeyFallback:
              type: boolean
              default: false
            stopTargetOnSessionStop:
              type: boolean
              default: false
            launcherComponent:
              type: string
            processMissingPolicy:
              type: string
              enum:
                - fail_session
                - pause_process_metrics_keep_device_metrics
                - wait_for_rebind
            enablePresentMonCapture:
              type: boolean
              default: false
              description: Windows PC-only explicit PresentMon CSV capture toggle. Missing/no-match/ambiguous capture emits no FPS metrics.
            presentMonCaptureDurationMs:
              type: integer
              default: 10000
              maximum: 120000
            presentMonTargetMode:
              type: string
              enum:
                - pid
                - process_name
              default: pid
            keepPresentMonCsv:
              type: boolean
              default: false
            presentMonRetentionMode:
              type: string
              enum:
                - delete_after_parse
                - keep_until_session_end
                - keep_user_requested
              default: delete_after_parse
            presentMonGracePeriodMs:
              type: integer
              default: 5000
    MetricEvent:
      type: object
      required:
        - sessionId
        - timestampMs
