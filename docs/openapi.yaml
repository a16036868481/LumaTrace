        paths:
          type: object
        logs:
          type: object
        storage:
          type: object
        limitations:
          type: object
        collectors:
          type: object
        diagnosticsSummary:
          type: object
        warnings:
          type: array
          items:
            type: string
    CreateSessionRequest:
      type: object
      required: [deviceId, targetId]
      properties:
        name:
          type: string
        deviceId:
          type: string
        targetId:
          type: string
        sampleIntervalMs:
          type: integer
        config:
          type: object
          description: Optional collector config. Android supports explicit lifecycle options and enableExperimentalFps. Safe lifecycle defaults are false.
          properties:
            profileName:
              type: string
            enableExperimentalFps:
              type: boolean
              default: false
              description: Android-only experimental FPS probe toggle. If layer matching fails or is ambiguous, no FPS metric is emitted.
            autoStartTarget:
              type: boolean
              default: false
            allowMonkeyFallback:
              type: boolean
              default: false
            stopTargetOnSessionStop:
              type: boolean
              default: false
            launcherComponent:
              type: string
            processMissingPolicy:
              type: string
              enum:
                - fail_session
                - pause_process_metrics_keep_device_metrics
                - wait_for_rebind
            enablePresentMonCapture:
              type: boolean
              default: false
              description: Windows PC-only explicit PresentMon CSV capture toggle. Missing/no-match/ambiguous capture emits no FPS metrics.
            presentMonCaptureDurationMs:
              type: integer
              default: 10000
              maximum: 120000
            presentMonTargetMode:
              type: string
              enum:
                - pid
                - process_name
              default: pid
            keepPresentMonCsv:
              type: boolean
              default: false
            presentMonRetentionMode:
              type: string
              enum:
                - delete_after_parse
                - keep_until_session_end
                - keep_user_requested
              default: delete_after_parse
    AndroidAppStartRequest:
      type: object
      properties:
        launcherComponent:
          type: string
        allowMonkeyFallback:
          type: boolean
          default: false
        waitForPid:
          type: boolean
          default: true
        waitTimeoutMs:
          type: integer
        pollIntervalMs:
          type: integer
    AndroidAppStartResult:
      type: object
      required: [ok, method, durationMs, warnings, diagnostics]
      properties:
        ok:
          type: boolean
        method:
          type: string
          enum: [am_start, monkey, none]
        launcherComponent:
          type: string
        pid:
          type: integer
        durationMs:
          type: integer
        warnings:
          type: array
          items:
            type: string
        diagnostics:
          type: array
          items:
            type: string
    AndroidAppStopRequest:
      type: object
      properties:
        waitUntilStopped:
          type: boolean
          default: true
        waitTimeoutMs:
          type: integer
        pollIntervalMs:
          type: integer
    AndroidAppStopResult:
      type: object
      required: [ok, method, durationMs, warnings, diagnostics]
      properties:
        ok:
          type: boolean
        method:
          type: string
